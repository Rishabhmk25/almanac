<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Almanac</title>
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('almanac-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch {}
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Typewriter Loading Screen -->
  <div id="loadingScreen" class="loading-screen" aria-live="polite">
    <div class="typewriter-box">
      <div class="typewriter-tape"></div>
      <div class="typewriter-text-wrap">
        <span id="typewriterText" class="typewriter-text"></span>
        <span class="typewriter-cursor"></span>
      </div>
      <div class="typewriter-sub">RESEARCH &middot; ARCHIVE &middot; INTELLIGENCE</div>
    </div>
  </div>

  <!-- Sidebar Backdrop -->
  <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>

  <!-- Hideable Sidebar for Chats -->
  <aside id="sidebar" class="sidebar" aria-label="Pages and History">
    <div class="sidebar-header">
      <div class="sidebar-brand-wrap">
        <span class="sidebar-tape"></span>
        <h2 id="deskTitle" class="sidebar-brand">ALMANAC</h2>
      </div>
      <button id="closeSidebar" class="cutout-btn close-btn" type="button" aria-label="Close sidebar">&times;</button>
    </div>

    <div class="sidebar-actions">
      <button id="newChat" class="cutout-btn new-chat-btn" type="button">
        <span class="cutout-plus">+</span> NEW PAGE
      </button>
    </div>

    <div class="sidebar-scroll">
      <nav id="convList" class="conv-list" aria-label="Saved chats"></nav>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-stamp">
        <span class="stamp-sq"></span>
        <span id="today" class="today"></span>
      </div>
    </div>
  </aside>

  <!-- Left Side Navigation Dock (Pages & New Page) -->
  <nav class="left-nav" aria-label="Page navigation">
    <button id="toggleSidebar" class="cutout-tab left-tab" type="button" aria-label="Open pages sidebar" title="Open pages and notes history (Ctrl+B)">
      <span class="tab-icon" aria-hidden="true">&#9776;</span>
      <span class="tab-label">PAGES</span>
    </button>
    <button id="quickNewChat" class="cutout-tab left-tab quick-new" type="button" aria-label="Start new page" title="Start fresh page">
      <span class="tab-plus" aria-hidden="true">+</span>
      <span class="tab-label">NEW</span>
    </button>
  </nav>

  <!-- Fixed Top Right Controls (Theme Toggle & Active Page Tag) -->
  <div class="top-right-controls">
    <div id="activePageTag" class="active-page-tag" hidden></div>
    <button id="toggleTheme" class="cutout-tab theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
      <span class="tab-icon" aria-hidden="true">&#9790;</span>
      <span class="tab-label">DARK</span>
    </button>
  </div>

  <!-- Quick Navigation Dock for Chat Thread (Right Side) -->
  <nav id="chatNav" class="chat-nav" aria-label="Chat quick navigation" hidden>
    <div class="chat-nav-tape" aria-hidden="true"></div>
    <button id="navJumpTop" class="cutout-btn chat-nav-btn" type="button" aria-label="Jump to top of chat" title="Jump to top">
      <span class="nav-arrow" aria-hidden="true">&#9650;</span>
      <span class="nav-label">TOP</span>
    </button>
    <button id="navPrevQ" class="cutout-btn chat-nav-btn nav-step-btn" type="button" aria-label="Jump to previous question" title="Previous question">
      <span class="nav-arrow" aria-hidden="true">&#9651;</span>
      <span class="nav-label">PREV</span>
    </button>
    <button id="navTurnBadge" class="chat-nav-badge" type="button" title="View questions index" aria-expanded="false" aria-controls="questionsPopover">
      0 MSGS &#9662;
    </button>
    <button id="navNextQ" class="cutout-btn chat-nav-btn nav-step-btn" type="button" aria-label="Jump to next question" title="Next question">
      <span class="nav-arrow" aria-hidden="true">&#9661;</span>
      <span class="nav-label">NEXT</span>
    </button>
    <button id="navJumpBottom" class="cutout-btn chat-nav-btn" type="button" aria-label="Jump to latest message" title="Jump to latest">
      <span class="nav-arrow" aria-hidden="true">&#9660;</span>
      <span class="nav-label">END</span>
    </button>

    <!-- Flyout Popover for Questions Index -->
    <div id="questionsPopover" class="questions-popover" hidden>
      <div class="questions-popover-tape" aria-hidden="true"></div>
      <div class="questions-popover-header">
        <span class="questions-popover-title">JUMP TO QUESTION</span>
        <button id="closeQuestionsPopover" class="cutout-btn close-questions-btn" type="button" aria-label="Close questions index">&times;</button>
      </div>
      <div class="questions-popover-scroll">
        <ul id="questionsList" class="questions-list"></ul>
      </div>
    </div>
  </nav>

  <!-- Floating Text Selection Reference Action Tooltip -->
  <div id="selectionRefTooltip" class="selection-ref-tooltip" hidden>
    <div class="sel-tooltip-tape" aria-hidden="true"></div>
    <button id="askRefBtn" class="cutout-btn sel-ref-btn" type="button" title="Ask Almanac to verify and provide reference for selected text">
      <span class="sel-icon" aria-hidden="true">&#128204;</span>
      <span class="sel-text">ASK REFERENCE</span>
    </button>
  </div>

  <!-- Main Workspace Shell -->
  <div class="shell">
    <div class="banner" id="banner" hidden></div>

    <main class="thread" id="thread" role="log" aria-live="polite" aria-busy="false" tabindex="-1"></main>

    <div class="composer-wrap">
      <form class="composer" id="composer">
        <div class="composer-tape"></div>
        <label class="sr" for="input">Message</label>
        <textarea id="input" rows="1" maxlength="4000"
          placeholder="Ask anything. I'll check our notes first, then the web."></textarea>
        <button class="send cutout-btn" id="send" type="submit" aria-label="Send" disabled>&#8629;</button>
      </form>
    </div>
  </div>

  <script src="/vendor/marked.umd.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <script src="/vendor/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
